plugins {
    id 'java'
}

group = 'com.bot'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation("dev.arbjerg:lavaplayer:2.2.4")
    implementation("com.github.lavalink-devs:youtube-source:1.16.0")
    implementation("io.github.cdimascio:dotenv-java:3.0.0")
    implementation("net.dv8tion:JDA:6.7.0")
    // 디스코드 음성 종단간 암호화(DAVE) 구현. 2026년 3월부터 DAVE 없이는 음성 연결이 거부됨
    implementation("moe.kyokobot.libdave:adapter-jda:0.2.0")
    implementation("moe.kyokobot.libdave:impl-jni:0.2.0")
    runtimeOnly("moe.kyokobot.libdave:natives-linux-x86-64:0.2.0")
    runtimeOnly("moe.kyokobot.libdave:natives-linux-aarch64:0.2.0")
    runtimeOnly("moe.kyokobot.libdave:natives-win-x86-64:0.2.0")
    runtimeOnly("moe.kyokobot.libdave:natives-darwin:0.2.0")

    implementation 'com.google.code.gson:gson:2.11.0'
    // 로그 출력용. 없으면 lavaplayer/youtube-source/JDA 로그(재생 실패 원인 등)가 출력되지 않음
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.19'

    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
}

test {
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

// 실제 Discord 토큰(.env)이나 YouTube 접속이 필요한 테스트: ./gradlew integrationTest
tasks.register('integrationTest', Test) {
    description = 'Discord 토큰이나 네트워크가 필요한 통합 테스트를 실행합니다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
}
